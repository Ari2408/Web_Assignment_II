# ==============================================================================
# Database & File Upload Configuration (db.properties)
# Student Profile Portal - Java Servlets, JSP, JDBC, MySQL
# ==============================================================================

# JDBC Connection Settings
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/student_management_servlet?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.user=root
db.password=

# Upload Directory Configuration
# Important: Set to a secured folder on your server outside the public web root
# For Windows (default): C:/student_portal_uploads/
# For Linux/macOS: /var/student_portal_uploads/
upload.dir=C:/student_portal_uploads/
